<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Sharefyx 4.0.0 — Launch-Film</title>
<style>
  @font-face { font-family: "IBM Plex Sans Var"; src: url("/static/fonts/IBMPlexSans-subset.6c21979f.woff2") format("woff2"); font-weight: 380 620; }
  @font-face { font-family: "IBM Plex Mono"; src: url("/static/fonts/IBMPlexMono-subset.a8d5dfa6.woff2") format("woff2"); font-weight: 400; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #raster { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  /* Vignette: die Ränder dunkler, der Blick bleibt in der Mitte. */
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse 75% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .tile { position: absolute; width: 1600px; height: 1000px; border-radius: 18px; overflow: hidden;
          background: #000; box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.07);
          transform-origin: 50% 50%; }
  .tile.karte { background: #14181D; }
  .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile.karte img { object-fit: contain; }
  .schatten { position: absolute; inset: 0; background: #000; }
  .streif { position: absolute; top: -5%; height: 110%; width: 140px; margin-left: -70px;
            background: linear-gradient(90deg, rgba(62,141,243,0), rgba(150,200,255,.85), rgba(46,184,166,0));
            filter: blur(6px); }
  /* Die Marke als Vektor — dieselben Werte wie `.rail__brand` in der App (16.2 gemessen). */
  .marke { position: absolute; left: 0; top: 0; width: 239px; box-sizing: border-box; padding: 8px 16px 16px; transform-origin: 0 0;
           font: 600 12.5px/19.375px "IBM Plex Sans Var"; letter-spacing: 1px; text-transform: uppercase;
           color: #E9EDF2; white-space: nowrap; }
  .marke img { height: 15.625px; width: auto; vertical-align: -2.75px; margin-right: 2.5px; }
  .marke .version { display: inline-block; margin-left: 4.95px; font: 400 11px/14px "IBM Plex Sans Var";
                    letter-spacing: .33px; text-transform: none; vertical-align: super; height: 14px; overflow: hidden; }
  .marke .version span { display: block; }
  .terminal { position: absolute; inset: 0; background: #0A0D12; font: 400 30px/46px "IBM Plex Mono";
              color: #C9D3DF; padding: 110px 90px; white-space: pre; }
  .terminal .kopf { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: #141A22;
                    font: 500 24px/64px "IBM Plex Sans Var"; color: #8B95A3; padding-left: 90px; }
  .terminal .ein { color: #6FB1FF; } .terminal .ok { color: #3FD1B5; }
  /* Der Text der Szene (16.8): auf der freien Seite, Wort für Wort. */
  #text { position: absolute; top: 540px; width: 540px; transform: translateY(-50%); }
  #text .titel { font: 600 50px/1.12 "IBM Plex Sans Var"; letter-spacing: -.015em; color: #F2F4F8; }
  #text .zeile { margin-top: 18px; font: 400 27px/1.38 "IBM Plex Sans Var"; color: #A9B7C8; }
  #text span { display: inline-block; white-space: pre; }
  #schleier { position: absolute; top: 0; bottom: 0; width: 900px; }
  #punkte { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #glyphe { position: absolute; left: 0; top: 0; font-weight: 600; font-family: "IBM Plex Sans Var";
            color: #F2F4F8; white-space: nowrap; transform-origin: 0 0; }
  #endtafel { position: absolute; left: 0; right: 0; top: 830px; text-align: center;
              font: 600 40px "IBM Plex Sans Var"; letter-spacing: 5px; text-transform: uppercase; color: #C9D3DF; }
  #endtafel img { height: 46px; vertical-align: -8px; margin-right: 6px; }
  #grain { position: absolute; inset: 0; width: 1920px; height: 1080px; mix-blend-mode: soft-light; opacity: .5; }
</style>
</head>
<body>
<canvas id="raster" width="1920" height="1080"></canvas>
<div id="world"></div>
<div id="vignette"></div>
<canvas id="punkte" width="1920" height="1080"></canvas>
<div class="marke" id="marke"><img src="/static/logo.svg" alt="">harefyx<span class="version"><span>v3.1.6</span><span>v4.0.0</span></span></div>
<div id="glyphe">4.0.0</div>
<div id="endtafel"><img src="/static/logo.svg" alt="">harefyx</div>
<div id="schleier"></div>
<div id="text"></div>
<canvas id="grain" width="960" height="540"></canvas>
<script type="module">
  import { cameraTransform, drawGrain, prng, easeInOut, clamp, lerp } from "/film/stage.js";
  import { KACHELN, CELL_W, CELL_H, TILE_W, TILE_H, VIER_BOX, MARKE_GROSS, zustand, welt2bild } from "/film/film.js";

  const world = document.getElementById("world");
  const el = {};
  for (const k of KACHELN) {
    const d = document.createElement("div");
    d.className = "tile" + (k.karte ? " karte" : "");
    d.style.left = k.zelle[0] * CELL_W + "px";
    d.style.top = k.zelle[1] * CELL_H + "px";
    const e = { box: d };
    if (k.terminal) {
      e.term = document.createElement("div");
      e.term.className = "terminal";
      d.appendChild(e.term);
    } else {
      e.img = document.createElement("img");
      d.appendChild(e.img);
      if (k.alt) {
        e.alt = document.createElement("img");
        e.alt.src = "/still/" + k.alt + ".png";
        d.appendChild(e.alt);
      }
    }
    // Der Streif läuft über **jede** Kachel, wenn ihr Text erscheint; nur bei den drei alten macht er
    // die UI neu (`alt` wird weggeschnitten).
    e.streif = document.createElement("div");
    e.streif.className = "streif";
    e.schatten = document.createElement("div");
    e.schatten.className = "schatten";
    d.append(e.streif, e.schatten);
    world.appendChild(d);
    el[k.id] = e;
  }
  // Die Marke (Vektor) liegt über dem Bild (nicht in der Welt): groß in der Mitte, dann gelandet
  // genau über der Marke der Leiste in s1 (Lage aus `markePose`).
  const marke = document.getElementById("marke");
  const rolle = marke.querySelectorAll(".version span");

  async function bildSetzen(img, name) {
    const src = "/still/" + name + ".png";
    if (img.getAttribute("src") === src) return;
    img.src = src;
    await img.decode();
  }

  // Das Transkript des echten MCP-Laufs (`ki_lauf.py`) als Zeilen. Die Mono-Schrift ist ein
  // Teilsatz — er hat `ä` (16.9 geprüft, Wächter `test_film_texts_are_in_the_font_subsets`).
  function terminalZeilen(lauf) {
    const [ls, si, ap] = lauf.schritte;
    const titel = Object.fromEntries((si.ergebnis.items || []).map((i) => [i.id, i.title]));
    const z = [];
    z.push(["ein", "> list_spaces()"]);
    z.push(["", "  " + ls.ergebnis.length + " Spaces: " + ls.ergebnis.map((s) => s.name).join(" . ")]);
    z.push(["ein", '> search_items(query: "Wochenplan", limit: 3)']);
    z.push(["", "  " + (si.ergebnis.items || []).length + " Treffer"]);
    z.push(["ein", "> append_to_items(" + ap.args.entries.length + " Einträge, je mit Version)"]);
    for (const r of ap.ergebnis.results) {
      const vorher = ap.args.entries.find((e) => e.item_id === r.item_id).version;
      z.push(["ok", "  ok  " + (titel[r.item_id] || r.item_id).padEnd(14) + " v" + vorher + " -> v" + r.version]);
    }
    z.push(["ok", "  " + ap.ergebnis.ok + " ok, " + ap.ergebnis.failed + " Fehler - ein Aufruf"]);
    return z;
  }

  // Zielpunkte der Punkte im Auftakt: die Tinte der Marke, so wie sie groß in der Mitte steht.
  // Gemessen wird die gesetzte Marke selbst (Rechtecke von Zeichen, Name, Version unter derselben
  // Transformation), nachgezeichnet auf einer Leinwand — fester Raster, feste Reihenfolge.
  function markeZiele() {
    const gs = MARKE_GROSS;
    marke.style.transform = `scale(${gs})`; // gemessen an (0, 0); verschoben wird danach
    const c = document.createElement("canvas"); c.width = 1920; c.height = 1080;
    const g = c.getContext("2d"); g.fillStyle = "#fff";
    const bild = marke.querySelector("img"), rb = bild.getBoundingClientRect();
    g.drawImage(bild, rb.left, rb.top, rb.width, rb.height);
    const text = (knoten, font, ls, gross = false) => {
      const r = document.createRange(); r.selectNodeContents(knoten);
      const b = r.getBoundingClientRect();
      g.font = font; g.letterSpacing = ls; g.textBaseline = "alphabetic";
      const m = g.measureText(knoten.textContent);
      // die Zeile zentriert die Schriftbox; die Grundlinie liegt um ihre Unterlänge über dem Boden
      const hoehe = m.fontBoundingBoxAscent + m.fontBoundingBoxDescent;
      g.fillText(gross ? knoten.textContent.toUpperCase() : knoten.textContent, b.left, b.top + (b.height - hoehe) / 2 + m.fontBoundingBoxAscent);
    };
    text(bild.nextSibling, `600 ${12.5 * gs}px "IBM Plex Sans Var"`, `${1 * gs}px`, true); // `text-transform` kennt die Leinwand nicht
    const alt = rolle[0];
    text(alt.firstChild, `400 ${11 * gs}px "IBM Plex Sans Var"`, `${0.33 * gs}px`);
    const d = g.getImageData(0, 0, 1920, 1080).data, tinte = [];
    for (let y = 0; y < 1080; y += 7) for (let x = 0; x < 1920; x += 7) if (d[(y * 1920 + x) * 4 + 3] > 128) tinte.push([x, y]);
    // Der Kasten der Leiste ist breiter als seine Tinte — die Mitte des Bildes trifft die Tinte.
    const xs = tinte.map((p) => p[0]), ys = tinte.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    geo.markeBox = { w: marke.offsetWidth, h: marke.offsetHeight, ix: x0 / gs, iy: y0 / gs, iw: (x1 - x0) / gs, ih: (y1 - y0) / gs };
    const gx = 960 - (x0 + x1) / 2, gy = 520 - (y0 + y1) / 2;
    return tinte.map(([x, y]) => [x + gx, y + gy]);
  }

  const geo = {};
  window.filmGeo = geo; // für Proben: die gemessenen Größen (Wächter `_GEO`)
  async function messen() {
    await document.fonts.load('600 100px "IBM Plex Sans Var"');
    await document.fonts.load('400 30px "IBM Plex Mono"');
    await marke.querySelector("img").decode();
    geo.markeZiele = markeZiele();
    // Der Knall: je Punkt eine feste Richtung und Weite (flach gedrückt wie das Bild), fester Seed.
    const rk = prng(0x0b16);
    geo.knall = geo.markeZiele.map(() => {
      const w = rk() * Math.PI * 2, r = 120 + 1000 * Math.pow(rk(), 0.7);
      return [Math.cos(w) * r, Math.sin(w) * r * 0.62, rk()];
    });
    // Staub: weitere Punkte, die nur auseinanderfliegen und verglimmen (der Knall ist größer als
    // die Marke).
    geo.staub = Array.from({ length: 1400 }, () => {
      const w = rk() * Math.PI * 2, r = 200 + 1500 * Math.pow(rk(), 0.55);
      return [Math.cos(w) * r, Math.sin(w) * r * 0.62];
    });
    const lauf = await (await fetch("/daten/ki_lauf.json")).json();
    geo.zeilen = terminalZeilen(lauf);
    geo.zeichen = geo.zeilen.reduce((a, z) => a + z[1].length, 0);
    // Marke: Mitte der Versionsangabe in Kachel-Koordinaten (aus `capture.py`, s1_neu.json).
    const s1 = await (await fetch("/daten/s1_neu.json")).json();
    const v = s1.dateien.s1_geometrie.find((g) => g[".rail__version"])[".rail__version"];
    geo.marke = { x: v.x + v.width / 2, y: v.y + v.height / 2 };
    // Die Glyphe: „4.0.0“ in großer Schrift auf eine Leinwand, Tintenrahmen messen.
    const F = 1000, c = document.createElement("canvas");
    c.width = 3200; c.height = 1300;
    const g = c.getContext("2d");
    g.font = `600 ${F}px "IBM Plex Sans Var"`;
    g.textBaseline = "alphabetic";
    const tinte = (text) => {
      g.clearRect(0, 0, c.width, c.height); g.fillStyle = "#fff"; g.fillText(text, 50, 1100);
      const d = g.getImageData(0, 0, c.width, c.height).data;
      let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1; const punkte = [];
      for (let y = 0; y < c.height; y += 1) for (let x = 0; x < c.width; x += 1) {
        if (d[(y * c.width + x) * 4 + 3] > 128) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
      return { x0, y0, x1, y1, d };
    };
    const ganz = tinte("4.0.0");
    const vier = tinte("4");
    // auf dem Bild: die ganze Schrift 1500 px breit, Mitte bei (960, 470)
    const s = 1500 / (ganz.x1 - ganz.x0);
    const ox = 960 - ((ganz.x0 + ganz.x1) / 2) * s, oy = 470 - ((ganz.y0 + ganz.y1) / 2) * s;
    geo.glyphe = { s, ox, oy, F, basis: 1100, links: 50 };
    const r4 = { x0: vier.x0 * s + ox, y0: vier.y0 * s + oy, x1: vier.x1 * s + ox, y1: vier.y1 * s + oy };
    const z = (r4.y1 - r4.y0) / VIER_BOX.h;
    geo.ziel = { z, cx: VIER_BOX.w / 2 - ((r4.x0 + r4.x1) / 2 - 960) / z, cy: VIER_BOX.h / 2 - ((r4.y0 + r4.y1) / 2 - 540) / z };
    // Zielpunkte: Tinte der ganzen Schrift auf einem Raster, fest sortiert.
    tinte("4.0.0");
    const d = ganz.d, ziele = [], schritt = 14;
    for (let y = ganz.y0; y <= ganz.y1; y += schritt) for (let x = ganz.x0; x <= ganz.x1; x += schritt) {
      if (d[(y * c.width + x) * 4 + 3] > 128) ziele.push([x * s + ox, y * s + oy]);
    }
    geo.ziele = ziele;
    // Quellen: je Punkt eine Kachel und ein fester Ort darin (Weltkoordinaten).
    const r = prng(0x0400);
    geo.quellen = ziele.map((_, i) => {
      const k = KACHELN[i % KACHELN.length];
      return [k.zelle[0] * CELL_W + r() * TILE_W, k.zelle[1] * CELL_H + r() * TILE_H, r()];
    });
    const gl = document.getElementById("glyphe");
    gl.style.fontSize = F * s + "px";
    gl.style.lineHeight = "1";
    // die Grundlinie der Leinwand (y = basis) auf dem Bild treffen
    gl.style.left = (50 * s + ox) + "px";
    const m = g.measureText("4.0.0");
    gl.style.top = (1100 * s + oy - m.fontBoundingBoxAscent * s - (F * s - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent) * s) / 2) + "px";
  }

  const FARBEN = ["#3E8DF3", "#2EB8A6", "#7FB6FF", "#E9EDF2"];
  // Der Text der Szene: Seite +1 = rechts. Jedes Wort ein eigenes Element (Deckkraft, Aufstieg,
  // Aufleuchten); der Schleier dunkelt die Textseite ab, wenn die Kachel beim Heranfahren hinüberwächst.
  const textEl = document.getElementById("text"), schleier = document.getElementById("schleier");
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  function textSetzen(t) {
    if (!t) { textEl.innerHTML = ""; schleier.style.opacity = "0"; return; }
    textEl.style.left = (t.seite > 0 ? 1300 : 80) + "px";
    textEl.style.textAlign = "left";
    const zeilen = [[], []];
    for (const w of t.woerter) {
      zeilen[w.zeile].push(`<span style="opacity:${w.deck};transform:translateY(${w.dy}px);`
        + `text-shadow:0 0 ${24 * w.glanz}px rgba(130,185,255,${0.9 * w.glanz})">${esc(w.wort)} </span>`);
    }
    textEl.innerHTML = `<div class="titel">${zeilen[0].join("")}</div><div class="zeile">${zeilen[1].join("")}</div>`;
    schleier.style.left = (t.seite > 0 ? 1020 : 0) + "px";
    schleier.style.background = `linear-gradient(${t.seite > 0 ? 90 : 270}deg, rgba(0,0,0,0), rgba(0,0,0,.9) 40%)`;
    schleier.style.opacity = String(t.schleier);
  }
  // Das Raster (16.7): Linien im Blau der Knöpfe (`--btn-std` #3E8DF3), sehr leise. Die Welle des
  // Knalls ist dasselbe Raster heller, auf einen Ring maskiert.
  const RASTER_DECK = 0.14, rasterWelle = document.createElement("canvas");
  rasterWelle.width = 1920; rasterWelle.height = 1080;
  function rasterLinien(g, r, deck) {
    const zeichne = (alpha, nurFein) => {
      if (alpha <= 0.002) return;
      g.strokeStyle = `rgba(62,141,243,${alpha})`; g.lineWidth = 1; g.beginPath();
      for (const [u, max, quer] of [[r.ux, 1920, false], [r.uy, 1080, true]]) {
        const m0 = Math.ceil(-u / r.abstand), m1 = Math.floor((max - u) / r.abstand);
        for (let m = m0; m <= m1; m++) {
          if ((Math.abs(m) % 2 === 1) !== nurFein) continue;
          const p = Math.round(u + m * r.abstand) + 0.5;
          if (quer) { g.moveTo(0, p); g.lineTo(1920, p); } else { g.moveTo(p, 0); g.lineTo(p, 1080); }
        }
      }
      g.stroke();
    };
    zeichne(deck, false);
    zeichne(deck * r.fein, true);
  }
  function rasterZeichnen(r) {
    const g = document.getElementById("raster").getContext("2d");
    g.clearRect(0, 0, 1920, 1080);
    rasterLinien(g, r, RASTER_DECK * r.deck);
    if (r.welle) {
      const w = rasterWelle.getContext("2d");
      w.globalCompositeOperation = "source-over"; w.clearRect(0, 0, 1920, 1080);
      rasterLinien(w, r, 0.6 * r.welle.deck);
      const ring = w.createRadialGradient(960, 520, Math.max(0, r.welle.r - 140), 960, 520, r.welle.r + 20);
      ring.addColorStop(0, "rgba(0,0,0,0)"); ring.addColorStop(0.8, "rgba(0,0,0,1)"); ring.addColorStop(1, "rgba(0,0,0,0)");
      w.globalCompositeOperation = "destination-in"; w.fillStyle = ring; w.fillRect(0, 0, 1920, 1080);
      g.drawImage(rasterWelle, 0, 0);
    }
  }
  // Eine Zeichenart für alle Punkte des Films (Auftakt und Finale): `lage(i)` → [x, y, Radius].
  function punkteZeichnen(pc, anzahl, deck, lage) {
    pc.globalAlpha = deck;
    for (let i = 0; i < anzahl; i++) {
      const [x, y, r] = lage(i);
      pc.fillStyle = FARBEN[i % FARBEN.length];
      pc.beginPath(); pc.arc(x, y, r, 0, Math.PI * 2); pc.fill();
    }
    pc.globalAlpha = 1;
  }
  // Ein weiches Licht (Funke, Blitz): radialer Verlauf, weiß → blau → nichts.
  function glimmen(pc, x, y, r, deck) {
    const v = pc.createRadialGradient(x, y, 0, x, y, r);
    v.addColorStop(0, `rgba(255,255,255,${deck})`);
    v.addColorStop(0.25, `rgba(150,200,255,${0.7 * deck})`);
    v.addColorStop(1, "rgba(62,141,243,0)");
    pc.fillStyle = v; pc.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  window.renderFrame = async (n) => {
    const z = zustand(n, geo);
    rasterZeichnen(z.raster);
    world.style.transform = cameraTransform(z.cam.cx, z.cam.cy, z.cam.z);
    const warten = [];
    z.kacheln.forEach((s, i) => {
      const e = el[s.id];
      e.box.style.transform = `translate(${s.x - KACHELN[i].zelle[0] * CELL_W}px, ${s.y - KACHELN[i].zelle[1] * CELL_H}px) rotate(${s.rot}deg)`
        + ` perspective(2600px) rotateY(${s.kipp.ry}deg) rotateX(${s.kipp.rx}deg) scale(${s.kipp.push})`;
      e.box.style.opacity = String(s.deckkraft);
      e.schatten.style.opacity = String(s.schatten);
      // Beim Ordnen leuchtet der Rand auf — die dunklen UI-Kacheln heben sich sonst kaum vom
      // Schwarz ab, und die 4 soll man **sehen**.
      e.box.style.boxShadow = s.rand > 0
        ? `0 0 0 ${28 * s.rand}px rgba(110,170,255,${0.7 * s.rand}), 0 0 ${120 * s.rand}px rgba(62,141,243,${0.45 * s.rand})`
        : "";
      if (e.img && s.bild) warten.push(bildSetzen(e.img, s.bild));
      if (e.alt) e.alt.style.clipPath = `inset(0 0 0 ${s.streif * 100}%)`;
      e.streif.style.left = s.streif * 100 + "%";
      e.streif.style.opacity = String(Math.sin(Math.PI * s.streif));
      if (e.term) {
        let rest = Math.round(s.terminal * geo.zeichen), html = '<div class="kopf">MCP-Client  -  sharefyx</div>';
        for (const [cls, text] of geo.zeilen) {
          if (rest <= 0) break;
          const teil = text.slice(0, rest); rest -= text.length;
          html += `<span class="${cls}">${teil.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>\n`;
        }
        e.term.innerHTML = html;
      }
    });
    const mp = z.marke.pose;
    marke.style.transform = `translate(${mp.x}px, ${mp.y}px) rotate(${mp.rot}deg) scale(${mp.s})`;
    marke.style.opacity = String(z.marke.deck);
    marke.style.background = `rgba(0,0,0,${z.marke.hg})`;
    rolle.forEach((sp) => { sp.style.transform = `translateY(${-14 * easeInOut(z.marke.roll)}px)`; });
    textSetzen(z.text);
    const pc = document.getElementById("punkte").getContext("2d");
    pc.clearRect(0, 0, 1920, 1080);
    // Auftakt: der Funke, der Blitz, die Punkte (auseinander → zur Marke).
    const a = z.auftakt;
    if (a.funke > 0) glimmen(pc, 960, 520, 8 + 46 * a.funke, a.funke);
    if (a.blitz > 0.01) glimmen(pc, 960, 520, 40 + 900 * (1 - a.blitz), a.blitz);
    if (a.punkte > 0) {
      const flug = 1 - Math.pow(1 - a.flug, 3); // ease-out: der Knall bremst
      const weiter = 1 + 0.25 * a.sammeln;      // der Staub treibt weiter, während er verglimmt
      punkteZeichnen(pc, geo.staub.length, a.punkte * (1 - a.sammeln), (i) =>
        [960 + geo.staub[i][0] * flug * weiter, 520 + geo.staub[i][1] * flug * weiter, 1.6]);
      punkteZeichnen(pc, geo.markeZiele.length, a.punkte, (i) => {
        const q = geo.knall[i], [tx, ty] = geo.markeZiele[i];
        const bx = 960 + q[0] * flug, by = 520 + q[1] * flug;
        const t = easeInOut(clamp((a.sammeln - q[2] * 0.3) / 0.7));
        const wirbel = Math.sin(Math.PI * t) * 90 * (q[2] - 0.5);
        return [lerp(bx, tx, t) + wirbel, lerp(by, ty, t) - wirbel, lerp(2.2, 2.6, t)];
      });
    }
    // Finale: aus den Kacheln (Bildposition unter der aktuellen Kamera) zur Glyphe.
    const pDeck = Math.min(z.zerfall, 1 - 0.85 * z.schrift);
    if (pDeck > 0) {
      punkteZeichnen(pc, geo.ziele.length, pDeck, (i) => {
        const q = geo.quellen[i], [sx, sy] = welt2bild(z.cam, q[0], q[1]), [tx, ty] = geo.ziele[i];
        const t = easeInOut(clamp((z.flug - q[2] * 0.35) / 0.65));
        const bogen = Math.sin(Math.PI * t) * 60 * (q[2] - 0.5);
        return [lerp(sx, tx, t) + bogen, lerp(sy, ty, t) - bogen, lerp(2.6, 3.4, t)];
      });
    }
    document.getElementById("glyphe").style.opacity = String(z.schrift);
    document.getElementById("endtafel").style.opacity = String(z.ende);
    drawGrain(document.getElementById("grain"), n);
    await Promise.all(warten);
  };
  window.stageReady = messen().then(() => Promise.all([...document.images].map((i) => i.decode().catch(() => null)))).then(() => true);
</script>
