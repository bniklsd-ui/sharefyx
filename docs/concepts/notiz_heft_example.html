<script>(() => {

const SELFTEST = location.hash === '#selftest';
const DB_NAME = SELFTEST ? `NotepadProLocalVault-SelfTest-${Date.now()}` : 'NotepadProLocalVault';
const DB_VERSION = 2;
const DEFAULT_PROFILE = {

};
const PBKDF2_ITERATIONS = 210000;
const VERIFY_CONTEXT = new TextEncoder().encode('notepad-pro-local-vault-verifier-v1');
const COLORS = ['#eaf0f8','#ff7777','#ffad66','#ffe16b','#69d99f','#69c8ff','#7aa7ff','#a98bff','#f28cca','#93a1b4','#111925','#ffffff'];
const HIGHLIGHTS = ['transparent','#fff1a6','#ffd5a3','#ffc1c1','#bff0d5','#bde7ff','#d6caff','#f7c7e5','#c9ced6','#6b5730','#27553c','#403365'];

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const esc = (s='') => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const bytesToB64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));

const fmtDate = iso => iso ? new Date(iso).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}) : '';

  if(!iso) return '';

  if(d < 604800e3) return `${Math.floor(d/86400e3)} Tage`;

};
const plainText = html => { const d=document.createElement('div'); d.innerHTML=html||''; return (d.textContent||'').replace(/\u00a0/g,' ').trim(); };

class LocalVaultDB {
  constructor(){ this.db=null; this.fallback=false; this.memory=false; this.mem={profiles:[],records:[],handles:[]}; }
  async open(){
    try{
      this.db = await new Promise((resolve,reject)=>{
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=()=>{
          const db=req.result;
          if(!db.objectStoreNames.contains('profiles')) db.createObjectStore('profiles',{keyPath:'id'});
          if(!db.objectStoreNames.contains('records')){
            const s=db.createObjectStore('records',{keyPath:'key'});
            s.createIndex('profileId','profileId',{unique:false});
            s.createIndex('profileType',['profileId','type'],{unique:false});
          }
          if(!db.objectStoreNames.contains('handles')) db.createObjectStore('handles',{keyPath:'key'});
        };
        req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error);
      });
    }catch(error){
      console.warn('IndexedDB nicht verfügbar, verwende lokalen Fallback.',error);
      this.fallback=true;
      try{const k='np-local-storage-test';localStorage.setItem(k,'1');localStorage.removeItem(k)}catch{this.memory=true;console.warn('Auch localStorage ist nicht verfügbar; Daten bleiben nur bis zum Schließen im Arbeitsspeicher.')}
    }
  }
  tx(store,mode='readonly'){ return this.db.transaction(store,mode).objectStore(store); }
  readFallback(store){
    if(this.memory)return this.mem[store]||[];
    try{return JSON.parse(localStorage.getItem(`np-local-vault-${store}-v3`)||'[]')}catch{return []}
  }
  writeFallback(store,items){
    if(this.memory){this.mem[store]=items;return}
    localStorage.setItem(`np-local-vault-${store}-v3`,JSON.stringify(items));
  }
  async get(store,key){
    if(this.fallback){const field=store==='profiles'?'id':'key';return clone(this.readFallback(store).find(x=>x[field]===key)||null)}
    return new Promise((res,rej)=>{const r=this.tx(store).get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});
  }
  async put(store,value){
    if(this.fallback){const items=this.readFallback(store),field=store==='profiles'?'id':'key',i=items.findIndex(x=>x[field]===value[field]);if(i>=0)items[i]=clone(value);else items.push(clone(value));this.writeFallback(store,items);return value}
    return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)});
  }
  async delete(store,key){
    if(this.fallback){const field=store==='profiles'?'id':'key';this.writeFallback(store,this.readFallback(store).filter(x=>x[field]!==key));return}
    return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
  }
  async all(store){
    if(this.fallback)return clone(this.readFallback(store));
    return new Promise((res,rej)=>{const r=this.tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});
  }
  async recordsFor(profileId){
    if(this.fallback)return clone(this.readFallback('records').filter(x=>x.profileId===profileId));
    return new Promise((res,rej)=>{const idx=this.tx('records').index('profileId');const r=idx.getAll(profileId);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});
  }
  async getDirectoryHandle(profileId){
    if(this.fallback||!this.db?.objectStoreNames.contains('handles'))return null;
    const row=await this.get('handles',`${profileId}:backup-directory`);return row?.handle||null;
  }
  async saveDirectoryHandle(profileId,handle){
    if(this.fallback||!this.db?.objectStoreNames.contains('handles'))throw new Error('Dateizugriff kann in diesem Speicher-Fallback nicht dauerhaft hinterlegt werden.');
    return this.put('handles',{key:`${profileId}:backup-directory`,profileId,handle,updatedAt:nowIso()});
  }
  async deleteDirectoryHandle(profileId){
    if(this.fallback||!this.db?.objectStoreNames.contains('handles'))return;
    await this.delete('handles',`${profileId}:backup-directory`);
  }
  async replaceProfileRecords(profileId, records, profileUpdate=null){
    if(this.fallback){const keep=this.readFallback('records').filter(x=>x.profileId!==profileId);this.writeFallback('records',[...keep,...clone(records)]);if(profileUpdate)await this.put('profiles',profileUpdate);return}
    return new Promise((resolve,reject)=>{
      const tx=this.db.transaction(['profiles','records'],'readwrite');
      const rs=tx.objectStore('records');
      const idx=rs.index('profileId');
      const cur=idx.openCursor(IDBKeyRange.only(profileId));
      cur.onsuccess=()=>{const c=cur.result;if(c){c.delete();c.continue();}else records.forEach(r=>rs.put(r));};
      if(profileUpdate) tx.objectStore('profiles').put(profileUpdate);
      tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
    });
  }
}
 
async function derivePassword(password,saltB64){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64ToBytes(saltB64),iterations:PBKDF2_ITERATIONS},material,256);
  const combined=new Uint8Array(bits.byteLength+VERIFY_CONTEXT.length); combined.set(new Uint8Array(bits));combined.set(VERIFY_CONTEXT,bits.byteLength);
  const verifier=bytesToB64(await crypto.subtle.digest('SHA-256',combined));
  const key=await crypto.subtle.importKey('raw',bits,{name:'AES-GCM'},false,['encrypt','decrypt']);
  return {key,verifier};
}
async function encryptJson(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(obj));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);
  return {iv:bytesToB64(iv),cipher:bytesToB64(cipher)};
}
async function decryptJson(key,record){
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(record.iv)},key,b64ToBytes(record.cipher));
  return JSON.parse(new TextDecoder().decode(plain));
}
 
function sanitizeStyle(style){
  const allowed=new Set(['color','background-color','text-align','font-size','font-family','margin-left','padding-left','border','border-color','vertical-align','width','height','max-width','min-width','float','display']);
  const tmp=document.createElement('span');tmp.setAttribute('style',style||'');
  const out=[];
  for(const p of [...tmp.style]) if(allowed.has(p)){
    let v=tmp.style.getPropertyValue(p).trim();
    if(/url\s*\(/i.test(v)||/expression\s*\(/i.test(v)) continue;
    out.push(`${p}:${v}`);
  }
  return out.join(';');
}
function safeHref(href){
  const h=(href||'').trim();
  if(/^#(?:note|asset):[a-zA-Z0-9_-]+$/.test(h)) return h;
  if(/^(https?:|mailto:|tel:)/i.test(h)) return h;
  return '';
}
function sanitizeHtml(html){
  const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','S','STRIKE','SUB','SUP','H1','H2','H3','H4','H5','H6','UL','OL','LI','BLOCKQUOTE','PRE','CODE','A','IMG','TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','HR','SPAN','MARK','FIGURE','FIGCAPTION','TIME','FONT']);
  const t=document.createElement('template');t.innerHTML=html||'<p></p>';
  const walk=node=>{
    for(const child of [...node.children]){
      if(!allowed.has(child.tagName)){
        child.replaceWith(...child.childNodes); continue;
      }
      for(const attr of [...child.attributes]){
        const n=attr.name.toLowerCase();
        const ok=['class','style','title','alt','colspan','rowspan','datetime','data-note-id','data-asset-id','data-asset-download','data-profile-id','data-task','data-checked','data-task-id','data-due','data-remind','data-reminded','data-type','href','target','rel','face','size','color'].includes(n);
        if(!ok||n.startsWith('on')) child.removeAttribute(attr.name);
      }
      if(child.hasAttribute('style')){const s=sanitizeStyle(child.getAttribute('style'));if(s)child.setAttribute('style',s);else child.removeAttribute('style');}
      if(child.tagName==='A'){
        const h=safeHref(child.getAttribute('href'));if(h)child.setAttribute('href',h);else child.removeAttribute('href');
        if(/^https?:/i.test(h)){child.setAttribute('target','_blank');child.setAttribute('rel','noopener noreferrer');}
      }
      if(child.tagName==='IMG'){
        if(!child.dataset.assetId){child.remove();continue;}
        child.removeAttribute('src');
      }
      if(['TD','TH'].includes(child.tagName)){
        const cs=Math.max(1,Math.min(20,Number(child.getAttribute('colspan')||1))); const rs=Math.max(1,Math.min(100,Number(child.getAttribute('rowspan')||1)));
        if(cs>1)child.setAttribute('colspan',String(cs));else child.removeAttribute('colspan');
        if(rs>1)child.setAttribute('rowspan',String(rs));else child.removeAttribute('rowspan');
      }
      walk(child);
    }
  };walk(t.content);
  return t.innerHTML||'<p></p>';
}
 
function markdownToHtml(md){
  const lines=String(md||'').replace(/\r/g,'').split('\n'); let out='',inCode=false,inUl=false,inOl=false;
  const closeLists=()=>{if(inUl){out+='</ul>';inUl=false}if(inOl){out+='</ol>';inOl=false}};
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`(.+?)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  for(const line of lines){
    if(/^```/.test(line)){closeLists();out+=inCode?'</code></pre>':'<pre><code>';inCode=!inCode;continue}
    if(inCode){out+=esc(line)+'\n';continue}
    let m;if((m=line.match(/^(#{1,3})\s+(.*)$/))){closeLists();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;continue}
    if((m=line.match(/^[-*]\s+\[([ xX])\]\s+(.*)$/))){closeLists();out+=`<ul class="task-list"><li class="task-item" data-task="true" data-checked="${m[1].toLowerCase()==='x'}"><span class="task-box">${m[1].toLowerCase()==='x'?'☑':'☐'}</span><span class="task-text">${inline(m[2])}</span></li></ul>`;continue}
    if((m=line.match(/^[-*]\s+(.*)$/))){if(!inUl){closeLists();out+='<ul>';inUl=true}out+=`<li>${inline(m[1])}</li>`;continue}
    if((m=line.match(/^\d+\.\s+(.*)$/))){if(!inOl){closeLists();out+='<ol>';inOl=true}out+=`<li>${inline(m[1])}</li>`;continue}
    closeLists();if(/^---+$/.test(line.trim()))out+='<hr>';else if(line.trim())out+=`<p>${inline(line)}</p>`;else out+='<p><br></p>';
  }closeLists();if(inCode)out+='</code></pre>';return sanitizeHtml(out);
}

      const sanitized=sanitizeHtml('<p>gut</p><script>window.bad=1<\/script><img src="https://example.com/x.png"><a href="javascript:alert(1)">x</a>');ok('HTML-Sanitizer',!sanitized.includes('script')&&!sanitized.includes('javascript')&&!sanitized.includes('https://example.com'));
      const enc=await encryptJson(this.key,{test:'AES-GCM'}),dec=await decryptJson(this.key,enc);ok('AES-Verschlüsselung',dec.test==='AES-GCM');
      const bundle=this.portableBundle();ok('Backup-Modell',bundle.data.notes.length>=1&&bundle.format==='notepad-pro-local-portable-v3');
      const reloadedRecord=await this.db.get('records',`${this.profile.id}:main:main`),reloaded=await decryptJson(this.key,reloadedRecord);ok('IndexedDB Reload',reloaded.notes.some(x=>x.title==='Selbsttest Notiz'));
      const fetchBlocked=await fetch('https://example.com',{mode:'no-cors'}).then(()=>false).catch(()=>true);ok('CSP Netzwerkblockade',fetchBlocked);
      const banner=document.createElement('div');banner.className='selftest-banner';banner.id='selftest-results';banner.dataset.status='pass';banner.textContent=`SELFTEST PASS · ${results.length}/${results.length}`;document.body.appendChild(banner);
    }catch(e){console.error(e);const banner=document.createElement('div');banner.className='selftest-banner';banner.id='selftest-results';banner.dataset.status='fail';banner.style.borderColor='#f66';banner.style.color='#ffb1b1';banner.textContent=`SELFTEST FAIL · ${e.message}`;document.body.appendChild(banner)}
  }
};

})();
