  <line x1="914" y1="318" x2="914" y2="327" stroke="#b03030" stroke-width="2.2" marker-end="url(#arR)"/>
  <rect x="60" y="328" width="964" height="30" rx="6" fill="#fbecec" stroke="#d99b9b"/>
  <text x="76" y="348" font-size="11.5" fill="#4a5a6b"><tspan font-weight="700" fill="#b03030">Befund 11 (2026-10-01): „doing“ wäre im Editor wählbar und in keinem Zähler sichtbar</tspan> → Deploy v3.1.0 verschoben, Block doing gebaut.</text>

  <!-- Lane 2 -->
  <text x="56" y="378" font-size="11" font-weight="700" fill="#6b7b8c">BLÖCKE — aus Befunden, Rückfragen und drei Bildsichtungen; jeder mit Probe und Gegenlauf</text>

  <rect x="60" y="386" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="170" y="405" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">doing · trace</text>
