  <!-- ================= Kopf ================= -->
  <rect x="0" y="0" width="1080" height="86" fill="#1d2b3a"/>
  <text x="36" y="36" font-size="19" font-weight="700" fill="#ffffff">Phase 9 — Härtung: Domain, Watchdog, Löschen, Nachvollziehbarkeit</text>
  <text x="36" y="62" font-size="12" fill="#9db2c6">Sharefyx · phase9_hardening/ · live als v3.1.4 seit 2026-10-08 (SHA d04c0ec) · health_gate 9/9 · Stand 2026-10-08</text>
  <rect x="794" y="18" width="250" height="50" rx="10" fill="#2f7a4d"/>
  <text x="919" y="38" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">121 ✅ · 12 ⚠️ · 1 ⬜</text>
  <text x="919" y="57" font-size="11" fill="#cfe6d8" text-anchor="middle">von 134 Abnahmezeilen, 0 ersetzt</text>

  <!-- ================= Mission ================= -->
  <rect x="36" y="100" width="1008" height="74" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="124" font-size="13.5" font-weight="700" fill="#1d2b3a">Mission: die letzten Schwächen beseitigen, damit P10 Features baut statt Grundlagen — kein UI-Umbau (Lock P9-A).</text>
  <text x="56" y="146" font-size="12" fill="#4a5a6b">Der Server bleibt <tspan font-weight="700" fill="#1d2b3a">dumm</tspan>: neu sind eine Adresse, ein Wächter, zwei Schema-Felder und ein Papierkorb — kein LLM-Call im Serverpfad.</text>
  <text x="56" y="165" font-size="12" fill="#4a5a6b">Acht geplante Steps, <tspan font-weight="700" fill="#1d2b3a">sieben Blöcke</tspan> aus Befunden, <tspan font-weight="700" fill="#1d2b3a">126 Commits</tspan>, fünf Deploys, pytest 995 → 1265 — und <tspan font-weight="700" fill="#2f7a4d">null</tspan> Service-Touch durch einen Agenten.</text>

  <!-- ================= Flussdiagramm ================= -->
  <rect x="36" y="186" width="1008" height="430" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="209" font-size="14.5" font-weight="700" fill="#1d2b3a">Reihenfolge 0 → D → C → E → F → G → H → B → A ↯ doing → trace → settings → 3 Sichtungen → feedback → Z</text>

  <!-- Lane 1 -->
  <text x="56" y="230" font-size="11" font-weight="700" fill="#6b7b8c">PLAN (2026-09-19) — acht Steps; Infra A/B/C als Coarbeit: M3 leitet an, der Nikinger tippt (P9-Q)</text>

  <rect x="60" y="238" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="170" y="257" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">0 Fundament · D Bugs</text>
  <text x="74" y="276" font-size="10" fill="#4a5a6b">INDEX-Rotation, doc_health</text>
  <text x="74" y="291" font-size="10" fill="#4a5a6b">Drop-Ziel Space-Wurzel</text>
  <text x="170" y="308" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">ESC/Vollbild = macOS, kein Code</text>

  <line x1="284" y1="277" x2="303" y2="277" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
