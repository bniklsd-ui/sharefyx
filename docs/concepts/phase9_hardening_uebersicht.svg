  <text x="74" y="439" font-size="10" fill="#4a5a6b">updated_by + Git-Autor (10.)</text>
  <text x="170" y="456" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">v3.1.0 · v3.1.1 live</text>

  <line x1="284" y1="425" x2="303" y2="425" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="308" y="386" width="220" height="78" rx="8" fill="#f7f0e4" stroke="#c9ab74" stroke-width="1.6"/>
  <text x="418" y="405" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">Übergang alte Adresse</text>
  <text x="322" y="424" font-size="10" fill="#4a5a6b">Firmen-Proxy sperrt neue Domain</text>
  <text x="322" y="439" font-size="10" fill="#4a5a6b">LEGACY_UNTIL=open</text>
  <text x="418" y="456" font-size="10" fill="#8a6d2f" text-anchor="middle" font-weight="700">v3.1.2 — Notfall-Release</text>

  <line x1="532" y1="425" x2="551" y2="425" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="556" y="386" width="220" height="78" rx="8" fill="#f7f0e4" stroke="#c9ab74" stroke-width="1.6"/>
  <text x="666" y="405" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">settings + 3 Sichtungen</text>
  <text x="570" y="424" font-size="10" fill="#4a5a6b">drei Overlays → eine Fensterkette</text>
  <text x="570" y="439" font-size="10" fill="#4a5a6b">V118: eine Linie</text>
  <text x="666" y="456" font-size="10" fill="#8a6d2f" text-anchor="middle" font-weight="700">zwei Locks am Folgetag widerrufen</text>

  <line x1="780" y1="425" x2="799" y2="425" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="804" y="386" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="914" y="405" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">feedback B1–B8 · E1a</text>
  <text x="818" y="424" font-size="10" fill="#4a5a6b">Anlegen landete im Home-Space</text>
  <text x="818" y="439" font-size="10" fill="#4a5a6b">Team-Spaces: verschieben, löschen</text>
  <text x="914" y="456" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">PATCH-Lücke seit 2026-08-17 zu</text>

  <!-- Messbefunde -->
  <rect x="60" y="476" width="964" height="54" rx="6" fill="#f2f5f8" stroke="#a8b8c8"/>
  <text x="76" y="496" font-size="11" fill="#4a5a6b"><tspan font-weight="700" fill="#1d2b3a">Gemessen statt geglaubt:</tspan> /overview kostet live ~3,1 s — 6 Durchgänge je sichtbarem Space, der VPS-Weg nur 2,4–3,6 %.</text>
  <text x="76" y="516" font-size="11" fill="#4a5a6b">Die Referenz 372,9 ms war nie über Funnel gemessen (in-process, synthetisch). Ein Space-Wechsel ist eine Anfrage, 12–20 ms lokal.</text>

  <line x1="540" y1="532" x2="540" y2="541" stroke="#2f7a4d" stroke-width="2.2" marker-end="url(#arG)"/>
  <rect x="60" y="542" width="964" height="62" rx="8" fill="#eaf4ee" stroke="#2f7a4d" stroke-width="2"/>
  <text x="76" y="563" font-size="12.5" font-weight="700" fill="#1d2b3a">Gate/Z — fünf Deploys v3.1.0 → v3.1.4, jeder mit health_gate 9/9 im Commit · Matrix 134 Zeilen · Handover</text>
  <text x="76" y="582" font-size="10.5" fill="#4a5a6b">Der erste v3.1.0-Deploy brach ab: <tspan font-weight="700" fill="#1d2b3a">requests</tspan> stand in keinem pyproject und lief nur im Dev-venv. Ein Test ist grün in der</text>
  <text x="76" y="596" font-size="10.5" fill="#4a5a6b">Umgebung, in der er läuft — das Release-venv ist frisch. Seither steht die echte Gate-Ausgabe im Commit, nicht der Satz.</text>

  <!-- ================= Ausführer-Band ================= -->
  <rect x="36" y="626" width="1008" height="96" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="648" font-size="14" font-weight="700" fill="#1d2b3a">Wer gebaut hat — und der Open-Test MiniMax M3 / M3.1 („Spacebunny“)</text>
  <!-- Zeitachse 09-20 .. 10-08 : x 60..1020, 19 Tage -> ~50.5 px/Tag -->
  <rect x="60" y="658" width="404" height="22" fill="#e8eef5" stroke="#7f9ab5"/>
  <text x="262" y="673" font-size="10" fill="#1d2b3a" text-anchor="middle">09-20 → 09-30 17:24 · Claude Code (0, D) · opencode/M3 (C, E, A, F, G)</text>
  <rect x="464" y="658" width="394" height="22" fill="#f7f0e4" stroke="#c9ab74"/>
  <text x="661" y="673" font-size="10" fill="#1d2b3a" text-anchor="middle">→ 10-06 · opencode/MiniMax M3.1 Preview, Effort max</text>
  <rect x="858" y="658" width="162" height="22" fill="#eaf4ee" stroke="#8fb59a"/>
  <text x="939" y="673" font-size="10" fill="#1d2b3a" text-anchor="middle">10-07 → · Claude Code</text>
  <!-- Opus-Einschuebe -->
  <rect x="526" y="680" width="10" height="6" fill="#2f7a4d"/>
  <rect x="566" y="680" width="10" height="6" fill="#2f7a4d"/>
  <rect x="754" y="680" width="10" height="6" fill="#2f7a4d"/>
  <text x="60" y="700" font-size="10.5" fill="#4a5a6b">Test-Fenster 037d9ed (09-28) → ed13127 (10-06): <tspan font-weight="700" fill="#1d2b3a">83 Commits</tspan> — 18 M3 · 1 Grenzfall · 48 M3.1 · <tspan fill="#2f7a4d" font-weight="700">16 Claude Opus</tspan> (grüne Marken).</text>
  <text x="60" y="715" font-size="10.5" fill="#4a5a6b">Offene Rubrik, N = 1, <tspan font-weight="700" fill="#b03030">nicht blind</tspan>: Plan-Treue 5 · Korrektheit 4 · Testqualität 3 · Commit-Hygiene 2. Details: Handover §7.</text>

  <!-- ================= Drei Mechanismen ================= -->
  <rect x="36" y="732" width="1008" height="122" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="754" font-size="14" font-weight="700" fill="#1d2b3a">Drei Dinge, die man aus dem Code nicht abliest</text>

  <rect x="56" y="762" width="310" height="82" rx="6" fill="#f2f5f8" stroke="#a8b8c8"/>
  <text x="72" y="780" font-size="11.5" font-weight="700" fill="#1d2b3a">Warum DATA_ROOT/._trash/</text>
  <text x="72" y="797" font-size="10" fill="#4a5a6b">Im Space-Ordner kam das gelöschte Item nach</text>
  <text x="72" y="811" font-size="10" fill="#4a5a6b">rebuild_index() zurück, und _trash wurde ein</text>
  <text x="72" y="825" font-size="10" fill="#4a5a6b">Phantom-Space. Der Punkt davor kostet null</text>
  <text x="72" y="839" font-size="10" fill="#4a5a6b">P1-Änderungen — beide Scanner kennen ihn.</text>

  <rect x="384" y="762" width="310" height="82" rx="6" fill="#f2f5f8" stroke="#a8b8c8"/>
  <text x="400" y="780" font-size="11.5" font-weight="700" fill="#1d2b3a">Warum polkit statt sudoers</text>
  <text x="400" y="797" font-size="10" fill="#4a5a6b">Die Unit setzt NoNewPrivileges — sudo lebt vom</text>
  <text x="400" y="811" font-size="10" fill="#4a5a6b">setuid-Bit und startet darunter nicht. Die JS-</text>
  <text x="400" y="825" font-size="10" fill="#4a5a6b">Regel prüft Unit und User; ohne das dürfte</text>
  <text x="400" y="839" font-size="10" fill="#4a5a6b">savefyx jede Unit neu starten.</text>

  <rect x="712" y="762" width="312" height="82" rx="6" fill="#fbecec" stroke="#d99b9b"/>
  <text x="728" y="780" font-size="11.5" font-weight="700" fill="#b03030">Warum ein Relay statt 0.0.0.0</text>
  <text x="728" y="797" font-size="10" fill="#4a5a6b">Die App bindet 127.0.0.1 (Lock P3-B). Der VPS</text>
  <text x="728" y="811" font-size="10" fill="#4a5a6b">erreicht sie über socat auf der Tailnet-IP. Lauf 4</text>
  <text x="728" y="825" font-size="10" fill="#4a5a6b">zeigt: das Tailnet lässt auch das MacBook an</text>
  <text x="728" y="839" font-size="10" fill="#4a5a6b">8765 — dort schützt nur die App selbst (P10).</text>

