  <text x="322" y="276" font-size="10" fill="#4a5a6b">RTX 3060 im LXC, 26,8 s statt 46–180</text>
  <text x="322" y="291" font-size="10" fill="#4a5a6b">kein zweiter /graph-Abruf</text>
  <text x="418" y="308" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">ohne nvidia-uvm lief nie CUDA</text>

  <line x1="532" y1="277" x2="551" y2="277" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="556" y="238" width="220" height="78" rx="8" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.6"/>
  <text x="666" y="257" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">F Schema · G · H</text>
  <text x="570" y="276" font-size="10" fill="#4a5a6b">doing/assignee (9. Öffnung)</text>
  <text x="570" y="291" font-size="10" fill="#4a5a6b">Löschen → ._trash · fastmcp==3.4.7</text>
  <text x="666" y="308" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">Plan-Ort für _trash unbaubar</text>

  <line x1="780" y1="277" x2="799" y2="277" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="804" y="238" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="914" y="257" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">B Watchdog · A Domain</text>
  <text x="818" y="276" font-size="10" fill="#4a5a6b">polkit-Regel, Rate-Limit live</text>
  <text x="818" y="291" font-size="10" fill="#4a5a6b">VPS + Caddy + socat-Relay</text>
  <text x="914" y="308" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">sharefyx.eurofyx.com live</text>

