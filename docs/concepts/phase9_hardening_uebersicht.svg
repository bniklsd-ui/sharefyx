  <rect x="56" y="894" width="310" height="54" rx="6" fill="#eaf4ee" stroke="#8fb59a"/>
  <text x="72" y="912" font-size="11" font-weight="700" fill="#1d2b3a">40 geschlossen, V118/V136 geerbt zu</text>
  <text x="72" y="928" font-size="10" fill="#4a5a6b">Funnel kann keine eigene Domain (V148),</text>
  <text x="72" y="941" font-size="10" fill="#4a5a6b">erste Live-Löschung beobachtet (V162 A)</text>
  <rect x="384" y="894" width="310" height="54" rx="6" fill="#fbecec" stroke="#d99b9b"/>
  <text x="400" y="912" font-size="11" font-weight="700" fill="#b03030">3 offen, alle nach P10</text>
  <text x="400" y="928" font-size="10" fill="#4a5a6b">V150 zweites Konto (ein Termin) ·</text>
  <text x="400" y="941" font-size="10" fill="#4a5a6b">V193/V194 Umbenennen (E2)</text>
  <rect x="712" y="894" width="312" height="54" rx="6" fill="#e8eef5" stroke="#7f9ab5"/>
  <text x="728" y="912" font-size="11" font-weight="700" fill="#1d2b3a">Zwei P1-Öffnungen, angekündigt</text>
  <text x="728" y="928" font-size="10" fill="#4a5a6b">9.: doing/assignee · 10.: updated_by</text>
  <text x="728" y="941" font-size="10" fill="#4a5a6b">beide ohne Migration, je genau drei Dateien</text>

  <!-- ================= Was P10 erbt ================= -->
  <rect x="36" y="966" width="1008" height="66" rx="8" fill="#ffffff" stroke="#d99b9b"/>
  <text x="56" y="987" font-size="13.5" font-weight="700" fill="#b03030">Was P10 erbt — Register zuerst, dann Bau (P10 / P10.5)</text>
  <text x="56" y="1005" font-size="10.5" fill="#4a5a6b"><tspan font-weight="700" fill="#1d2b3a">Wünsche:</tspan> Ladezeiten, 404/Logo/Tab-Titel, Editor ohne Vorschau-Modus. <tspan font-weight="700" fill="#1d2b3a">Erbe:</tspan> /overview-Schleife, Tailnet-ACL, Ordner in Team-Spaces,</text>
  <text x="56" y="1020" font-size="10.5" fill="#4a5a6b">Space umbenennen, Vision-Ersatz, Ausführer-Wahl. Quelle: phase10_intake.md + PHASE9_CLOSEOUT_HANDOVER.md §4.</text>

  <!-- ================= Fuss ================= -->
  <text x="36" y="1050" font-size="10.5" fill="#6b7b8c">pytest 1265 (995 → 1265) · ui_budget 5/5, 173,1 KB von 250 KB · Tabu-Diff: ein Treffer (P9-56, Testattrappe) · doc_health 0 · Service-Touch 0</text>
  <text x="36" y="1067" font-size="10.5" fill="#6b7b8c">Kanonischer Closeout: phase9_hardening/ABNAHME_MATRIX.md · Handover: PHASE9_CLOSEOUT_HANDOVER.md · Head: phase9_hardening/CLAUDE.md</text>

