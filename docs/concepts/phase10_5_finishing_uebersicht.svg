  <text x="56" y="617" font-size="11" fill="#1d2b3a">Soll (Nikinger 07.11.): optisch wie ein Word-/Writer-Dokument, die gespeicherte Datei bleibt Markdown/HTML.</text>
  <text x="56" y="634" font-size="11" fill="#4a5a6b">Gesehen: Fließtext in Festbreitenschrift · Link als Rohsyntax [Vorgabe](#item/…) · sichtbare „#“-Zeichen · weiße Kästchen · breite Tabelle läuft über</text>
  <text x="56" y="651" font-size="11" fill="#4a5a6b">Blöcke 11/13 erfüllten das Maß ihrer Zeit (P10.5-50–55, 62–64); eine eigene Zeile öffnen = Entscheidung des Nikingers, nicht gezählt.</text>
  <text x="56" y="668" font-size="11" fill="#4a5a6b">Gemessen im Editor-Plan: F11 Plex Mono 13 px gegen Lesesicht Plex Sans 16 px · F5 Listenzeichen versteckt → <tspan font-weight="700" fill="#b03030">Leitziel P11</tspan> (S4, S5a)</text>

