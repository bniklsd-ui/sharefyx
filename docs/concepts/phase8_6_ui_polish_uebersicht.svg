  <rect width="1080" height="1080" fill="#f7f8fa"/>

  <!-- ================= Kopf ================= -->
  <rect x="0" y="0" width="1080" height="86" fill="#1d2b3a"/>
  <text x="36" y="36" font-size="19" font-weight="700" fill="#ffffff">Phase 8.6 — UI-Politur: Layout-Reorg, Layering, Rail-Umkehr</text>
  <text x="36" y="62" font-size="12.5" fill="#9db2c6">Sharefyx · phase8_6_ui_polish/ · live als v3.0.2 seit main@1ad2665 (2026-09-18) · health_gate 9/9 · Stand 2026-09-19</text>
  <rect x="794" y="18" width="250" height="50" rx="10" fill="#2f7a4d"/>
  <text x="919" y="38" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">45 ✅ · 5 ⚠️ · 0 ⬜</text>
  <text x="919" y="57" font-size="11" fill="#cfe6d8" text-anchor="middle">von 54 Abnahmezeilen, 4 davon ersetzt</text>

  <!-- ================= Mission ================= -->
  <rect x="36" y="102" width="1008" height="74" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="126" font-size="13.5" font-weight="700" fill="#1d2b3a">Mission: die Oberfläche aufräumen, die Phase 8 hinterließ — und ausliefern, was die Sichtprüfung dreimal zurückschickte.</text>
  <text x="56" y="148" font-size="12" fill="#4a5a6b">Der Zweck der Phase ist <tspan font-weight="700" fill="#1d2b3a">nicht</tspan> die Politur, sondern der Deploy: eine Politur, die niemand sieht, ist keine. Unter Druck fällt jeder Block, nie der Gate.</text>
  <text x="56" y="167" font-size="12" fill="#4a5a6b">Zwei Pläne, <tspan font-weight="700" fill="#1d2b3a">38 Commits</tspan>, 930/256 Zeilen Produktcode, 1.556/44 in Tests — und <tspan font-weight="700" fill="#2f7a4d">genau eine</tspan> vorher angekündigte Tabu-Ausnahme.</text>

  <!-- ================= Flussdiagramm ================= -->
  <rect x="36" y="190" width="1008" height="462" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="214" font-size="15" font-weight="700" fill="#1d2b3a">Reihenfolge 0 → V → A → B → C/D ↯ E → F → G → G-R → H → H-R → H-R-3 → J → Gate → Z</text>

  <!-- Lane 1 -->
  <text x="56" y="236" font-size="11" font-weight="700" fill="#6b7b8c">PLAN 1 (2026-09-09) — gebaut, getestet, am 2026-09-12 nicht abgenommen</text>
  <rect x="60" y="244" width="220" height="80" rx="8" fill="#f2f5f8" stroke="#a8b8c8" stroke-width="1.6"/>
  <text x="170" y="264" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">Step 0 + Step V</text>
  <text x="74" y="284" font-size="10" fill="#4a5a6b">6 Doku-Links, 4 L1-Cards, INDEX</text>
  <text x="74" y="299" font-size="10" fill="#4a5a6b">Ollama + qwen3-vl:8b lokal</text>
  <text x="170" y="316" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">Plugin gemessen → zurückgebaut</text>

  <line x1="284" y1="284" x2="303" y2="284" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="308" y="244" width="220" height="80" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="418" y="264" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">Block A — Fundament</text>
  <text x="322" y="284" font-size="10" fill="#4a5a6b">Radiogruppe zurück auf &lt;select&gt;</text>
  <text x="322" y="299" font-size="10" fill="#4a5a6b">6 Layer-/Selektions-Tokens</text>
  <text x="418" y="316" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">--border-soft war nie definiert</text>

  <line x1="532" y1="284" x2="551" y2="284" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="556" y="244" width="220" height="80" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="666" y="264" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">Block B — Selektion</text>
  <text x="570" y="284" font-size="10" fill="#4a5a6b">eine Hover-Regel statt drei</text>
  <text x="570" y="299" font-size="10" fill="#4a5a6b">Kategorie „Vorsicht", 2 Träger</text>
  <text x="666" y="316" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">Test hält die Zahl, nicht das Auge</text>

  <line x1="780" y1="284" x2="799" y2="284" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="804" y="244" width="220" height="80" rx="8" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.6"/>
  <text x="914" y="264" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">Block C + D</text>
  <text x="818" y="284" font-size="10" fill="#4a5a6b">Rail-Reorg, Spaces, Zähler</text>
  <text x="818" y="299" font-size="10" fill="#4a5a6b">V102-Dedup, FNV-1a-Seed, rafId</text>
  <text x="914" y="316" font-size="10" fill="#4a5a6b" text-anchor="middle" font-weight="700">geliefert — nicht auslieferbar</text>

  <!-- Bruchstelle -->
  <line x1="914" y1="326" x2="914" y2="333" stroke="#b03030" stroke-width="2.2" marker-end="url(#arR)"/>
  <rect x="60" y="334" width="964" height="30" rx="6" fill="#fbecec" stroke="#d99b9b"/>
  <text x="76" y="354" font-size="11.5" fill="#4a5a6b"><tspan font-weight="700" fill="#b03030">Sichtprüfung 2026-09-12: neun UX-Befunde statt Freigabe.</tspan> Drei öffnen gelockte Entscheidungen — P8.6-O2 (.shell), C1/N3 (Rail), P8.6-E (Layer).</text>

  <!-- Lane 2 -->
  <text x="56" y="384" font-size="11" font-weight="700" fill="#6b7b8c">PLAN 2 (2026-09-13) — misst zuerst, baut dann; drei Sichtungs-Revisionen unterwegs</text>
  <rect x="60" y="392" width="220" height="80" rx="8" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.6"/>
  <text x="170" y="412" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">E — messen, nicht bauen</text>
  <text x="74" y="432" font-size="10" fill="#4a5a6b">CDP-Probe bei 1024/1200/1440,</text>
  <text x="74" y="447" font-size="10" fill="#4a5a6b">zweimal: main und v3.0.1</text>
  <text x="170" y="464" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">9a = 9b — Annahme war falsch</text>

  <line x1="284" y1="432" x2="303" y2="432" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="308" y="392" width="220" height="80" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="418" y="412" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">F — Layering</text>
  <text x="322" y="432" font-size="10" fill="#4a5a6b">--panel-meta-line WAR --warn</text>
  <text x="322" y="447" font-size="10" fill="#4a5a6b">bei 22 %, byte-genau</text>
  <text x="418" y="464" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">2 Wächter gegen rohe Hex</text>

  <line x1="532" y1="432" x2="551" y2="432" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="556" y="392" width="220" height="80" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="666" y="412" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">G — Layout-Umbau</text>
  <text x="570" y="432" font-size="10" fill="#4a5a6b">.shell → 240px 480px 1fr</text>
  <text x="570" y="447" font-size="10" fill="#4a5a6b">(P8.6-O2 ausgelöst, entschieden)</text>
  <text x="666" y="464" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">Editor ersetzt Karte, ESC holt sie</text>

  <line x1="780" y1="432" x2="799" y2="432" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="804" y="392" width="220" height="80" rx="8" fill="#f7f0e4" stroke="#c9ab74" stroke-width="1.6"/>
  <text x="914" y="412" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">G-R — Revision 1</text>
  <text x="818" y="432" font-size="10" fill="#4a5a6b">Breakpoints 1200 + 1024,</text>
  <text x="818" y="447" font-size="10" fill="#4a5a6b">Layer-Ton, Editor-Head sticky</text>
  <text x="914" y="464" font-size="10" fill="#8a6d2f" text-anchor="middle" font-weight="700">erste Runde nach der Sichtung</text>

  <rect x="60" y="488" width="220" height="80" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="170" y="508" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">H — Rail + Konto</text>
  <text x="74" y="528" font-size="10" fill="#4a5a6b">Umkehr von C1/N3-Lesart b —</text>
  <text x="74" y="543" font-size="10" fill="#4a5a6b">Abmelden bleibt außen</text>
  <text x="170" y="560" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">Test umgekehrt statt gelöscht</text>

  <line x1="284" y1="528" x2="303" y2="528" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="308" y="488" width="220" height="80" rx="8" fill="#f7f0e4" stroke="#c9ab74" stroke-width="1.6"/>
  <text x="418" y="508" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">H-R — Revision 2</text>
  <text x="322" y="528" font-size="10" fill="#4a5a6b">OLED-BLACK, Akzent-Fill,</text>
  <text x="322" y="543" font-size="10" fill="#4a5a6b">YAML bündig: 27,14 → 0,86 px</text>
  <text x="418" y="560" font-size="10" fill="#8a6d2f" text-anchor="middle" font-weight="700">2 von 5 Punkten ohne Fix</text>

  <line x1="532" y1="528" x2="551" y2="528" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="556" y="488" width="220" height="80" rx="8" fill="#f7f0e4" stroke="#c9ab74" stroke-width="1.6"/>
  <text x="666" y="508" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">H-R-3 — Revision 3</text>
  <text x="570" y="528" font-size="10" fill="#4a5a6b">1024 ohne Map, Editor-Full,</text>
  <text x="570" y="543" font-size="10" fill="#4a5a6b">Listen-Slot exklusiv</text>
  <text x="666" y="560" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">kein JS/HTML-Touch nötig</text>

  <line x1="780" y1="528" x2="799" y2="528" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="804" y="488" width="220" height="80" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="914" y="508" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">J — der „Flake"</text>
  <text x="818" y="528" font-size="10" fill="#4a5a6b">1,569 % der IDs fangen mit</text>
  <text x="818" y="543" font-size="10" fill="#4a5a6b">„-" an — argparse liest Flag</text>
  <text x="914" y="560" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">kein Flake — ein Produktionsbug</text>

  <line x1="540" y1="570" x2="540" y2="579" stroke="#2f7a4d" stroke-width="2.2" marker-end="url(#arG)"/>
  <rect x="60" y="580" width="964" height="60" rx="8" fill="#eaf4ee" stroke="#2f7a4d" stroke-width="2"/>
  <text x="76" y="601" font-size="12.5" font-weight="700" fill="#1d2b3a">Gate GA1–GA4 + Step Z — Wegwerf-Ritt · p86_polish_smoke.py 18/18 · Nikinger-Sichtprüfung · Deploy v3.0.2 · health_gate 9/9</text>
  <text x="76" y="620" font-size="10.5" fill="#4a5a6b">Der Deploy scheiterte zuerst an <tspan font-weight="700" fill="#1d2b3a">umask 0177</tspan> in der Nikinger-Shell: git clone legt Verzeichnisse mit 0777 &amp; ~umask an, das ergibt 0600 —</text>
  <text x="76" y="634" font-size="10.5" fill="#4a5a6b">kein Execute-Bit, für niemanden betretbar, auch nicht für den Eigentümer. Eine Klasse Fehler, die ls -la nicht zeigt.</text>

  <!-- ================= Drei Mechanismen ================= -->
  <rect x="36" y="660" width="1008" height="140" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="684" font-size="14.5" font-weight="700" fill="#1d2b3a">Drei Dinge, die man aus dem Code nicht abliest</text>

  <rect x="56" y="694" width="310" height="90" rx="6" fill="#f2f5f8" stroke="#a8b8c8"/>
  <text x="72" y="714" font-size="11.5" font-weight="700" fill="#1d2b3a">Warum zwei Pläne und drei Revisionen</text>
  <text x="72" y="732" font-size="10" fill="#4a5a6b">Die Drei-Bedingungen-Regel (Tests grün ·</text>
  <text x="72" y="747" font-size="10" fill="#4a5a6b">Bilder laut Agent grün · Nikinger gesichtet)</text>
  <text x="72" y="762" font-size="10" fill="#4a5a6b">blieb fünfmal an der dritten Bedingung</text>
  <text x="72" y="777" font-size="10" fill="#4a5a6b">hängen. Genau dafür ist sie da.</text>

  <rect x="384" y="694" width="310" height="90" rx="6" fill="#f2f5f8" stroke="#a8b8c8"/>
  <text x="400" y="714" font-size="11.5" font-weight="700" fill="#1d2b3a">Warum kein Server-Touch für V102</text>
  <text x="400" y="732" font-size="10" fill="#4a5a6b">Die Zwillingskante wäre im Index billig zu</text>
  <text x="400" y="747" font-size="10" fill="#4a5a6b">deduplizieren — das wäre die neunte P1-</text>
  <text x="400" y="762" font-size="10" fill="#4a5a6b">Contract-Öffnung. dedupeEdges() im Front-</text>
  <text x="400" y="777" font-size="10" fill="#4a5a6b">end kostet 20 Zeilen und lässt sie zu.</text>

  <rect x="712" y="694" width="312" height="90" rx="6" fill="#fbecec" stroke="#d99b9b"/>
  <text x="728" y="714" font-size="11.5" font-weight="700" fill="#b03030">Warum die Gate-Ausgabe im Commit steht</text>
  <text x="728" y="732" font-size="10" fill="#4a5a6b">Plan 1 hatte „health_gate 8/8" notiert, ohne</text>
  <text x="728" y="747" font-size="10" fill="#4a5a6b">dass der Lauf je stattfand — am 2026-09-13</text>
  <text x="728" y="762" font-size="10" fill="#4a5a6b">am Server widerlegt. Seitdem gilt: die</text>
  <text x="728" y="777" font-size="10" fill="#4a5a6b">Ausgabe kommt in den Commit, nicht in den Satz.</text>

  <!-- ================= VERIFY-Bilanz ================= -->
  <rect x="36" y="810" width="1008" height="104" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="834" font-size="14.5" font-weight="700" fill="#1d2b3a">[VERIFY]-Bilanz V97 / V103–V144 — 37 geschlossen, 2 offen, 2 nachträglich bilanziert</text>
  <rect x="56" y="844" width="310" height="60" rx="6" fill="#eaf4ee" stroke="#8fb59a"/>
  <text x="72" y="863" font-size="11" font-weight="700" fill="#1d2b3a">37 geschlossen — drei negativ</text>
  <text x="72" y="880" font-size="10" fill="#4a5a6b">V110, V113, V125: dreimal lag der Plan</text>
  <text x="72" y="895" font-size="10" fill="#4a5a6b">falsch und der Code richtig.</text>
  <rect x="384" y="844" width="310" height="60" rx="6" fill="#fbecec" stroke="#d99b9b"/>
  <text x="400" y="863" font-size="11" font-weight="700" fill="#b03030">2 offen, bewusst übergeben</text>
  <text x="400" y="880" font-size="10" fill="#4a5a6b">V118 Zwillingskante — ohne Hover keine</text>
  <text x="400" y="895" font-size="10" fill="#4a5a6b">Labels · V136 Chips vs. Drop-Ziel</text>
  <rect x="712" y="844" width="312" height="60" rx="6" fill="#e8eef5" stroke="#7f9ab5"/>
  <text x="728" y="863" font-size="11" font-weight="700" fill="#1d2b3a">V134 nach zwei Phasen geschlossen</text>
  <text x="728" y="880" font-size="10" fill="#4a5a6b">der sudo-Prompt ist sichtbar — live</text>
  <text x="728" y="895" font-size="10" fill="#4a5a6b">bestätigt, nicht erschlossen.</text>

  <!-- ================= Was P9 erbt ================= -->
  <rect x="36" y="924" width="1008" height="90" rx="8" fill="#ffffff" stroke="#d99b9b"/>
  <text x="56" y="948" font-size="14.5" font-weight="700" fill="#b03030">Was P9 erbt — benannt, nicht stillgelegt</text>
  <text x="56" y="969" font-size="11" fill="#4a5a6b"><tspan font-weight="700" fill="#1d2b3a">Zwei Bugs mit erstem Messbefund:</tspan> kein Drop-Ziel zurück auf die Space-Wurzel (tree.js:205 ist die einzige Aufrufstelle) · ESC prüft kein fullscreenElement.</text>
  <text x="56" y="988" font-size="11" fill="#4a5a6b"><tspan font-weight="700" fill="#1d2b3a">Ein Rechte-Thema, kein CSS-Thema:</tspan> Verschieben in fremde Spaces ist Hard Rule 4 / .share.yml — Einstieg ist phase6_shares_plan.md, nicht app.css.</text>
  <text x="56" y="1007" font-size="11" fill="#4a5a6b"><tspan font-weight="700" fill="#1d2b3a">Fünf Feature-Wünsche · Domain · Watchdog · INDEX-Rotation (dritter Verstoß)</tspan> — alle in PHASE8_6_CLOSEOUT_HANDOVER.md §4.</text>

  <!-- ================= Fuss ================= -->
  <text x="36" y="1034" font-size="11" fill="#6b7b8c">995 pytest grün (V107: 964 → 995) · ui_budget 5/5, Bundle 144,7 KB von 250 KB · Tabu-Diff leer bis auf die angekündigte P8.6-AJ-Ausnahme · Service-Touch 0</text>
  <text x="36" y="1051" font-size="11" fill="#6b7b8c">Kanonischer Closeout: docs/concepts/phase8_6_ui_polish_plan2.md §9 · Handover: PHASE8_6_CLOSEOUT_HANDOVER.md · Head: phase8_6_ui_polish/CLAUDE.md</text>
  <text x="36" y="1068" font-size="10.5" fill="#8a97a5">main steht auf 860ed72, live ist 1ad2665 — die Differenz ist deploy.sh + sein Regressionstest + Doku, kein Anwendungscode. Der nächste Deploy zieht sie nach.</text>

</svg>
