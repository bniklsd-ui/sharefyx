    <g><rect x="877" y="878" width="66" height="52" rx="6" fill="#2E1C1B" stroke="#E2685F"/><text class="sub"  x="910" y="898" text-anchor="middle">12</text><text class="lbl red" x="910" y="919" text-anchor="middle">✗</text></g>
    <g><rect x="951" y="878" width="66" height="52" rx="6" fill="#2E1C1B" stroke="#E2685F"/><text class="sub"  x="984" y="898" text-anchor="middle">13</text><text class="lbl red" x="984" y="919" text-anchor="middle">✗</text></g>
