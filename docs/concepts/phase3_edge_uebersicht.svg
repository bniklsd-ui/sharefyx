  <text class="sub" x="63" y="954">Zeile 6 Reboot — passiv abwarten · 12 Backup-Timer-Lauf · 13 Restore-Nachweis (B5).</text>
  <text class="sub" x="63" y="972">Nikinger-Entscheidung 2026-07-27: nicht aktiv nachgeholt, sondern an P4 vererbt.</text>
  <text class="sub amber" x="63" y="990">Deshalb 🟡 und nicht ✅ — ✅ heißt in diesem Projekt „live-verifiziert“, nicht „gebaut“.</text>

