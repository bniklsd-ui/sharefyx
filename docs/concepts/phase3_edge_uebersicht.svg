    <g><rect x="433" y="878" width="66" height="52" rx="6" fill="#2A2416" stroke="#E0A33E"/><text class="sub"  x="466" y="898" text-anchor="middle">6</text><text class="lbl amber" x="466" y="919" text-anchor="middle">□</text></g>
    <g><rect x="507" y="878" width="66" height="52" rx="6" fill="#16302270" stroke="#55C57A"/><text class="sub"  x="540" y="898" text-anchor="middle">7</text><text class="lbl green" x="540" y="919" text-anchor="middle">✓</text></g>
    <g><rect x="581" y="878" width="66" height="52" rx="6" fill="#16302270" stroke="#55C57A"/><text class="sub"  x="614" y="898" text-anchor="middle">8</text><text class="lbl green" x="614" y="919" text-anchor="middle">✓</text></g>
    <g><rect x="655" y="878" width="66" height="52" rx="6" fill="#16302270" stroke="#55C57A"/><text class="sub"  x="688" y="898" text-anchor="middle">9</text><text class="lbl green" x="688" y="919" text-anchor="middle">✓</text></g>
    <g><rect x="729" y="878" width="66" height="52" rx="6" fill="#16302270" stroke="#55C57A"/><text class="sub"  x="762" y="898" text-anchor="middle">10</text><text class="lbl green" x="762" y="919" text-anchor="middle">✓</text></g>
