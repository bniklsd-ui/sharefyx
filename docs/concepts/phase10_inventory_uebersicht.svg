  <text x="170" y="438" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">im Browser gehalten, 14/14</text>

  <rect x="308" y="400" width="220" height="50" rx="7" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.4"/>
  <text x="418" y="419" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M6 Karte (200 Knoten)</text>
  <text x="418" y="438" font-size="10" fill="#4a5a6b" text-anchor="middle">Ruhe 2,7 s · Lappen ≤ 1,9 ms</text>

  <rect x="556" y="400" width="220" height="50" rx="7" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.4"/>
  <text x="666" y="419" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M7 Editor-Bibliothek</text>
  <text x="666" y="438" font-size="10" fill="#4a5a6b" text-anchor="middle">CodeMirror 5: 239 KB &lt; 250 KB</text>

  <rect x="804" y="400" width="220" height="50" rx="7" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.4"/>
  <text x="914" y="419" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M8 Vision auf CT 111</text>
  <text x="914" y="438" font-size="10" fill="#4a5a6b" text-anchor="middle">qwen2.5vl:7b besteht die Falle</text>

  <!-- Befund -->
  <rect x="60" y="462" width="964" height="50" rx="7" fill="#fbecec" stroke="#d99a9a" stroke-width="1.4"/>
  <text x="76" y="482" font-size="12" font-weight="700" fill="#b03030">Probe 2026-10-20: /overview hält den ganzen Event-Loop — sogar /health wartet 4,3–4,8 s dahinter.</text>
  <text x="76" y="501" font-size="11" fill="#4a5a6b">Ursache: synchrones store.search() in async def _overview (api.py:685). Ein to_thread löst Z2, nicht Z1 — Wirkung unverifiziert.</text>

  <line x1="542" y1="514" x2="542" y2="523" stroke="#2f7a4d" stroke-width="1.8" marker-end="url(#arG)"/>

  <!-- D-3 -->
  <rect x="60" y="528" width="964" height="58" rx="8" fill="#eaf4ee" stroke="#2f7a4d" stroke-width="2"/>
  <text x="76" y="549" font-size="12.5" font-weight="700" fill="#1d2b3a">D-3 Zielwerte des Nikingers (2026-10-20) — die Abnahmezeilen für den Performance-Block von P10.5</text>
  <text x="76" y="570" font-size="11" fill="#4a5a6b">Z1 /overview ≤ 300 ms (unter Vorbehalt) · Z2 kein Request wartet dahinter · Z3 Gerüst ≤ 1 s · Z4 über 200 ms ⇒ Ladezustand, darunter sofort</text>

  <!-- ================= Ausführer ================= -->
  <rect x="36" y="610" width="1008" height="102" rx="8" fill="#ffffff" stroke="#d5dce4"/>
