  <text x="666" y="276" font-size="10" fill="#4a5a6b" text-anchor="middle">D-1–D-18 in fünf Runden</text>
  <text x="666" y="291" font-size="10" fill="#4a5a6b" text-anchor="middle">Karte C2 · Editor 1+2 · Logo B</text>
  <text x="666" y="308" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">zwei P1-Öffnungen (11., 12.)</text>

  <line x1="780" y1="277" x2="799" y2="277" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="804" y="238" width="220" height="78" rx="8" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.6"/>
  <text x="914" y="257" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">2 Messungen M1–M8</text>
  <text x="914" y="276" font-size="10" fill="#4a5a6b" text-anchor="middle">Wegwerf 8799, zwei Principals</text>
  <text x="914" y="291" font-size="10" fill="#4a5a6b" text-anchor="middle">M1 im Browser des Nikingers</text>
  <text x="914" y="308" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">8 von 8 · P10-5 ✅</text>

  <!-- Lane 2: Messungen -->
  <text x="56" y="336" font-size="11" font-weight="700" fill="#6b7b8c">MESSUNGEN — grün gehalten, rot = Defekt oder Ablehnung reproduziert, blau = Grundlinie; jede Station mit Gegenlauf</text>

  <rect x="60" y="344" width="220" height="50" rx="7" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.4"/>
  <text x="170" y="363" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M1 Browser (Nikinger)</text>
  <text x="170" y="382" font-size="10" fill="#4a5a6b" text-anchor="middle">/overview 4,8–5,2 s auf jedem Weg</text>

  <rect x="308" y="344" width="220" height="50" rx="7" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.4"/>
  <text x="418" y="363" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M2 Bench-Instrument</text>
  <text x="418" y="382" font-size="10" fill="#4a5a6b" text-anchor="middle">Median 2,4 s · drei Läufe ±1 %</text>

  <rect x="556" y="344" width="220" height="50" rx="7" fill="#fbecec" stroke="#d99a9a" stroke-width="1.4"/>
  <text x="666" y="363" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M3 opencode-Registrierung</text>
  <text x="666" y="382" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">400 invalid_redirect_uri</text>

  <rect x="804" y="344" width="220" height="50" rx="7" fill="#fbecec" stroke="#d99a9a" stroke-width="1.4"/>
  <text x="914" y="363" font-size="11.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">M4 BG-1</text>
  <text x="914" y="382" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">leere Space-Liste reproduziert</text>

  <rect x="60" y="400" width="220" height="50" rx="7" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.4"/>
