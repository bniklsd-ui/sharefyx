  <rect width="1080" height="1080" fill="#f7f8fa"/>

  <!-- ================= Kopf ================= -->
  <rect x="0" y="0" width="1080" height="86" fill="#1d2b3a"/>
  <text x="36" y="36" font-size="19" font-weight="700" fill="#ffffff">Phase 10 — Bestandsaufnahme vor dem Bau</text>
  <text x="36" y="62" font-size="12" fill="#9db2c6">Sharefyx · phase10_inventory/ · kein Produktcode (P10-H) · live bleibt v3.1.4 · 16.–20.10.2026</text>
  <rect x="774" y="18" width="270" height="50" rx="10" fill="#2f7a4d"/>
  <text x="909" y="38" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">9 ✅ · 1 ⚠️ · 2 ⬜</text>
  <text x="909" y="57" font-size="11" fill="#cfe6d8" text-anchor="middle">12 Zeilen · beide ⬜ wandern nach P10.5</text>

  <!-- ================= Mission ================= -->
  <rect x="36" y="100" width="1008" height="74" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="124" font-size="13.5" font-weight="700" fill="#1d2b3a">Mission: jede offene Baustelle einsammeln, messen, entscheiden lassen — ohne eine Zeile Produktcode.</text>
  <text x="56" y="146" font-size="12" fill="#4a5a6b">P10 und P10.5 sind <tspan font-weight="700" fill="#1d2b3a">eine Mission in zwei Hälften</tspan>: P9 war das Fundament, jetzt wird das Haus fertig gebaut und gedämmt.</text>
  <text x="56" y="165" font-size="12" fill="#4a5a6b">Messen vor Bauen (P10-F) · <tspan font-weight="700" fill="#1d2b3a">27 Commits</tspan> in fünf Tagen · pytest 1265 → 1268 (nur Messinstrument) · Tabu-Diff <tspan font-weight="700" fill="#2f7a4d">leer</tspan> · Service-Touch <tspan font-weight="700" fill="#2f7a4d">0</tspan></text>

  <!-- ================= Flussdiagramm ================= -->
  <rect x="36" y="186" width="1008" height="412" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="209" font-size="14.5" font-weight="700" fill="#1d2b3a">Reihenfolge 0 → 1 → 3 ∥ 2 → Z · Step 4 (Plan P10.5) wandert in den Planungschat</text>

  <!-- Lane 1 -->
  <text x="56" y="230" font-size="11" font-weight="700" fill="#6b7b8c">STEPS — Claude Code mit dem Nikinger; Step 3 lief parallel zu Step 2 (nur D-3 wartete auf M1, D-4 auf M7)</text>

  <rect x="60" y="238" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="170" y="257" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">0 Verifikation</text>
  <text x="170" y="276" font-size="10" fill="#4a5a6b" text-anchor="middle">doc_health 0 · 3 Heads benannt</text>
  <text x="170" y="291" font-size="10" fill="#4a5a6b" text-anchor="middle">Caddy-Quelle hinkt nach (BT-1)</text>
  <text x="170" y="308" font-size="10" fill="#b03030" text-anchor="middle" font-weight="700">7 Ledger-Posten ohne Vermerk</text>

  <line x1="284" y1="277" x2="303" y2="277" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="308" y="238" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="418" y="257" font-size="12.5" font-weight="700" fill="#1d2b3a" text-anchor="middle">1 Register</text>
  <text x="418" y="276" font-size="10" fill="#4a5a6b" text-anchor="middle">76 Zeilen in elf Themen</text>
  <text x="418" y="291" font-size="10" fill="#4a5a6b" text-anchor="middle">je Zeile ein Anker am Code</text>
  <text x="418" y="308" font-size="10" fill="#2f7a4d" text-anchor="middle" font-weight="700">39 Zeilen → P10.5</text>

  <line x1="532" y1="277" x2="551" y2="277" stroke="#5a6b7d" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="556" y="238" width="220" height="78" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
