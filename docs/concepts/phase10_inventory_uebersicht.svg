  <rect x="548" y="756" width="476" height="76" rx="8" fill="#e8eef5" stroke="#7f9ab5" stroke-width="1.6"/>
  <text x="564" y="776" font-size="12" font-weight="700" fill="#1d2b3a">Planungschat P10.5 (Opus) übernimmt Step 4 und das Tor</text>
  <text x="564" y="793" font-size="10.5" fill="#4a5a6b">1. Register freigeben (P10-8, der Nikinger)</text>
  <text x="564" y="808" font-size="10.5" fill="#4a5a6b">2. Plan schreiben: zwölf Blöcke, fünf davon groß mit Mini-Plan</text>
  <text x="564" y="823" font-size="10.5" fill="#4a5a6b">Abschluss P10.5: Nicht-Claude-Client führt list_spaces live aus</text>

