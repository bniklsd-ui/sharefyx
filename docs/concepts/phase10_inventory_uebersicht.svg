  <rect x="60" y="642" width="196" height="26" fill="#e8eef5" stroke="#7f9ab5"/>
  <text x="158" y="659" font-size="9.5" fill="#1d2b3a" text-anchor="middle">10-16 Claude Code · 0 / 1 / 3</text>
  <rect x="256" y="642" width="220" height="26" fill="#f6efe0" stroke="#c9a46a"/>
  <text x="366" y="659" font-size="9.5" fill="#1d2b3a" text-anchor="middle">10-18 opencode + GLM-Flash · M2–M6</text>
  <rect x="476" y="642" width="200" height="26" fill="#f6efe0" stroke="#c9a46a"/>
  <text x="576" y="659" font-size="9.5" fill="#1d2b3a" text-anchor="middle">10-19 Claude Code + GLM · M7, M8</text>
  <rect x="676" y="642" width="124" height="26" fill="#fbecec" stroke="#d99a9a"/>
  <text x="738" y="659" font-size="9.5" fill="#b03030" text-anchor="middle" font-weight="700">GLM verworfen</text>
  <rect x="800" y="642" width="224" height="26" fill="#e8eef5" stroke="#7f9ab5"/>
  <text x="912" y="659" font-size="9.5" fill="#1d2b3a" text-anchor="middle">10-20 Claude Code · M1, Probe</text>

  <text x="60" y="688" font-size="10.5" fill="#4a5a6b">Kosten-Treiber: opencode gab GLM 1 M Kontext an und kompaktierte nie — 278 Aufrufe, Kontext p50 326 K, <tspan font-weight="700" fill="#b03030">86,1 M Tokens</tspan> in einer Session.</text>
  <text x="60" y="704" font-size="10.5" fill="#4a5a6b">Dazu Token-Glitches in committetem Text. Ausführer P10.5: <tspan font-weight="700" fill="#1d2b3a">MiniMax M3 über opencode</tspan> (Endpunkt bis 2026-11-15), Marktblick ~2026-11-10.</text>

  <!-- ================= Brücke P10 → P10.5 ================= -->
  <rect x="36" y="724" width="1008" height="118" rx="8" fill="#ffffff" stroke="#d5dce4"/>
  <text x="56" y="746" font-size="14.5" font-weight="700" fill="#1d2b3a">P10 → P10.5: der Handover ist das Planungsdossier, nicht das Ende der Mission</text>

  <rect x="60" y="756" width="384" height="76" rx="8" fill="#eaf4ee" stroke="#8fb59a" stroke-width="1.6"/>
  <text x="76" y="776" font-size="12" font-weight="700" fill="#1d2b3a">P10 liefert (ohne Produktcode)</text>
  <text x="76" y="793" font-size="10.5" fill="#4a5a6b">Register: 76 Zeilen, bleibt die Arbeitsliste</text>
  <text x="76" y="808" font-size="10.5" fill="#4a5a6b">D-1–D-18 beantwortet · Locks P10-A–K</text>
  <text x="76" y="823" font-size="10.5" fill="#4a5a6b">M1–M8 und die Probe als Werkzeuge im Repo</text>

  <line x1="450" y1="794" x2="542" y2="794" stroke="#2f7a4d" stroke-width="2.2" marker-end="url(#arG)"/>
