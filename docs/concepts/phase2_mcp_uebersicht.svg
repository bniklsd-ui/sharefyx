<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Sharefyx Phase 2 — MCP-Server</title>
  <desc id="d">Der Weg eines Requests: vom Custom Connector über die Token-Auflösung und sechs Tools bis zur Rule-4-Grenze. Der eigene Space ist les- und schreibbar, fremde Spaces sind durch eine Sperre gedeckelt, die nur Lesezugriffe durchlässt und deren Inhalte in untrusted_content wrappt.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace; }
      .sans { font-family: 'Inter','Helvetica Neue',Arial,sans-serif; }
      .eyebrow { font-size: 15px; letter-spacing: 4.5px; fill: #7E95A3; }
      .h1 { font-size: 56px; font-weight: 700; fill: #EDE7D9; letter-spacing: -1px; }
      .sub { font-size: 19px; fill: #A9BDC8; }
      .box-t { font-size: 19px; font-weight: 700; fill: #EDE7D9; letter-spacing: 0.6px; }
      .box-s { font-size: 14px; fill: #93AAB7; }
      .edge { font-size: 13px; fill: #7E95A3; letter-spacing: 1px; }
      .card-t { font-size: 15px; font-weight: 700; letter-spacing: 2.4px; }
      .card-b { font-size: 14px; fill: #C3D2DA; }
      .num { font-size: 38px; font-weight: 700; fill: #EDE7D9; }
      .numlab { font-size: 12px; fill: #7E95A3; letter-spacing: 1.5px; }
      .foot-k { font-size: 12.5px; letter-spacing: 2.4px; fill: #7E95A3; }
      .foot-v { font-size: 15px; fill: #B7C7D0; }
    </style>

    <marker id="ar-mint" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#6FBFA0"/>
    </marker>
    <marker id="ar-ochre" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#D9A036"/>
    </marker>
    <marker id="ar-grey" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#5C7484"/>
    </marker>

    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#A8443A"/>
      <rect width="4.5" height="9" fill="#7C332C"/>
    </pattern>
  </defs>

  <rect width="1080" height="1080" fill="#111C24"/>

  <!-- ══════ HEADER ══════ -->
  <text x="64" y="96" class="mono eyebrow">SHAREFYX · GETEILTER SPACE-SERVER</text>
  <text x="64" y="154" class="mono h1">PHASE 2</text>
  <text x="302" y="154" class="mono h1" fill="#6FBFA0">MCP-SERVER</text>
  <text x="64" y="190" class="sans sub">Claude liest und schreibt — lokal, ohne Tunnel. Ein dünner Adapter über dem P1-Storage-Kern.</text>

  <g transform="translate(892,104) rotate(-9)">
    <rect x="-118" y="-40" width="236" height="80" rx="4" fill="none" stroke="#A8443A" stroke-width="3"/>
    <rect x="-110" y="-32" width="220" height="64" rx="2" fill="none" stroke="#A8443A" stroke-width="1.2"/>
    <text x="0" y="-6" text-anchor="middle" class="mono" font-size="19" font-weight="700" fill="#C05446" letter-spacing="1.5">LIVE-VERIFIZIERT</text>
    <text x="0" y="17" text-anchor="middle" class="mono" font-size="13" fill="#A8443A" letter-spacing="2.5">2026-07-26</text>
  </g>

  <line x1="64" y1="212" x2="1016" y2="212" stroke="#2B3B47" stroke-width="1.5"/>

  <!-- ══════ DER WEG EINES REQUESTS ══════ -->

  <rect x="230" y="236" width="620" height="52" rx="6" fill="#1A2833" stroke="#33454F" stroke-width="1.5"/>
  <text x="540" y="262" text-anchor="middle" class="mono box-t">CLAUDE.AI · CUSTOM CONNECTOR</text>
  <text x="540" y="280" text-anchor="middle" class="sans box-s">die Verbindung kommt von Anthropics Backend, nie vom Client</text>

  <line x1="540" y1="288" x2="540" y2="318" stroke="#5C7484" stroke-width="2" marker-end="url(#ar-grey)"/>
  <text x="556" y="310" class="mono edge">POST /mcp/&#8249;token&#8250; · Streamable HTTP</text>

  <rect x="230" y="322" width="620" height="52" rx="6" fill="#1A2833" stroke="#33454F" stroke-width="1.5"/>
  <text x="540" y="348" text-anchor="middle" class="mono box-t">STARLETTE-WURZEL</text>
  <text x="540" y="366" text-anchor="middle" class="sans box-s">Route /health — offen · Mount /mcp — geschützt</text>

  <line x1="540" y1="374" x2="540" y2="404" stroke="#5C7484" stroke-width="2" marker-end="url(#ar-grey)"/>

  <rect x="230" y="408" width="620" height="70" rx="6" fill="#1A2833" stroke="#4A6070" stroke-width="1.5"/>
  <text x="540" y="434" text-anchor="middle" class="mono box-t">TOKEN → IDENTITÄT</text>
  <text x="540" y="454" text-anchor="middle" class="sans box-s">sha256(token) → Keyring {hash: space} → Principal · einmal pro Request</text>
  <text x="540" y="471" text-anchor="middle" class="sans box-s" fill="#C05446">unbekannt ⇒ HTTP 401 ohne Detail · fail-closed, nie ein Tool-Fehler</text>

  <line x1="540" y1="478" x2="540" y2="502" stroke="#5C7484" stroke-width="2" marker-end="url(#ar-grey)"/>

  <rect x="230" y="506" width="620" height="78" rx="6" fill="#1A2833" stroke="#33454F" stroke-width="1.5"/>
  <text x="540" y="532" text-anchor="middle" class="mono box-t">FASTMCP · stateless_http=True</text>
  <text x="540" y="556" text-anchor="middle" class="mono box-s" fill="#A9BDC8">list_spaces · search_items · get_item</text>
  <text x="540" y="576" text-anchor="middle" class="mono box-s" fill="#A9BDC8">create_item · update_item · append_to_item</text>

  <!-- Verzweigung -->
  <line x1="540" y1="584" x2="540" y2="600" stroke="#5C7484" stroke-width="2"/>
  <line x1="292" y1="600" x2="788" y2="600" stroke="#5C7484" stroke-width="2"/>
  <line x1="292" y1="600" x2="292" y2="662" stroke="#6FBFA0" stroke-width="2.5" marker-end="url(#ar-mint)"/>
  <line x1="788" y1="600" x2="788" y2="700" stroke="#D9A036" stroke-width="2.5" marker-end="url(#ar-ochre)"/>

  <!-- ══════ SIGNATURE: die Sperre ══════ -->
  <text x="64" y="636" class="mono" font-size="13" font-weight="700" fill="#6FBFA0" letter-spacing="2">✓ LESEN + SCHREIBEN</text>
  <text x="560" y="636" class="mono" font-size="13" font-weight="700" fill="#C05446" letter-spacing="2">RULE 4 · ✕ SCHREIBEN</text>

  <rect x="560" y="646" width="200" height="12" fill="url(#hatch)"/>
  <rect x="816" y="646" width="200" height="12" fill="url(#hatch)"/>

  <!-- Karte links -->
  <rect x="64" y="668" width="456" height="144" rx="8" fill="#16242E" stroke="#6FBFA0" stroke-width="2"/>
  <rect x="64" y="668" width="6" height="144" rx="3" fill="#6FBFA0"/>
  <text x="92" y="698" class="mono card-t" fill="#6FBFA0">EIGENER SPACE</text>
  <text x="92" y="730" class="mono" font-size="26" font-weight="700" fill="#EDE7D9">niklas/</text>
  <text x="92" y="758" class="sans card-b">Ziel jeder Schreiboperation — implizit, weil</text>
  <text x="92" y="777" class="sans card-b">die Schreib-Tools keinen space-Parameter haben.</text>
  <text x="92" y="796" class="sans card-b">Bodies kommen im Klartext zurück.</text>

  <!-- Karte rechts -->
  <rect x="560" y="668" width="456" height="144" rx="8" fill="#241E14" stroke="#D9A036" stroke-width="2"/>
  <rect x="560" y="668" width="6" height="144" rx="3" fill="#D9A036"/>
  <text x="588" y="698" class="mono card-t" fill="#D9A036">FREMDE SPACES</text>
  <text x="588" y="730" class="mono" font-size="26" font-weight="700" fill="#EDE7D9">n beliebig</text>
  <text x="588" y="758" class="sans card-b">Schreiben existiert nicht als Codepfad.</text>
  <text x="588" y="777" class="mono" font-size="14" fill="#D9A036">&lt;untrusted_content space="…"&gt;</text>
  <text x="588" y="796" class="sans card-b">umschließt Body und Snippet · repair_drift=False</text>

  <line x1="64" y1="840" x2="1016" y2="840" stroke="#2B3B47" stroke-width="1.5"/>

  <!-- ══════ ZAHLEN ══════ -->
  <text x="64"  y="890" class="mono num">8</text>
  <text x="64"  y="912" class="mono numlab">STEPS 0–7</text>

  <text x="254" y="890" class="mono num">10</text>
  <text x="254" y="912" class="mono numlab">MODULE</text>

  <text x="444" y="890" class="mono num">57</text>
  <text x="444" y="912" class="mono numlab">TESTS PHASE 2</text>

  <text x="634" y="890" class="mono num" fill="#6FBFA0">133</text>
  <text x="634" y="912" class="mono numlab">GRÜN GESAMT</text>

  <text x="824" y="890" class="mono num" fill="#6FBFA0">21/21</text>
  <text x="824" y="912" class="mono numlab">LIVE-PRÜFUNGEN</text>

  <line x1="64" y1="940" x2="1016" y2="940" stroke="#2B3B47" stroke-width="1.5"/>

  <!-- ══════ FOOTER ══════ -->
  <text x="64" y="974" class="mono foot-k">ZURÜCKGESTELLT</text>
  <text x="278" y="974" class="sans foot-v">D6 SQL-Filterung · MCP-Revision 2026-07-28 · Lese-Rechte zwischen Spaces</text>

  <text x="64" y="1006" class="mono foot-k">NÄCHSTE PHASE</text>
  <text x="278" y="1006" class="sans foot-v" fill="#EDE7D9">P3 — Exposure &amp; Betrieb: Tunnel, systemd, Health, Request-Log, Backup</text>
</svg>
