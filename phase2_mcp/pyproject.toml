[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpserver"
version = "0.1.0"
description = "MCP-Server des Space-Servers (Phase 2) — Streamable HTTP, Token-Auth, sechs Tools"
requires-python = ">=3.10"
# `fastmcp` EXAKT, nicht als Range — das ist P3-D ("Patchversionen ändern hier Verhalten, und
# unter einem Dauerdienst darf sich das nicht unbemerkt bewegen") und P4-R, beide seit 2026-08
# beschlossen und bis 2026-09-30 **nie im Code umgesetzt**: hier stand `>=3.4,<3.5` seit dem
# ersten Commit (1c131c2). Gemessene Folge, 2026-09-30: `deploy.sh:153` baut pro Release ein
# frisches venv + `pip install -e` (scripts/dev_install.sh:9-13), ein Range-Pin löst also auf das
# jeweils neueste 3.4.x auf — der Live-Release `20260918T183907` (read-only gemessen)
# `fastmcp 3.4.7 / mcp 1.30.0`, während das Dev-venv noch 3.4.4 trug. Genau der stumme Drift,
# den P3-D verbieten wollte, hatte also bereits stattgefunden. Der exakte Pin macht daraus eine
# bewusste Entscheidung; `phase9_hardening/tests/test_step_h_deps.py` vergleicht die installierte
# Version gegen diese Zeile und läuft im Release-venv mit (deploy.sh:169) — ein Drift ist damit
# ein roter Deploy statt ein stiller.
# [2026-10-22, P10.5 Block 5] Obergrenze 3.4.x (P9-R) aufgehoben — FastMCP 4 / MCP 2026-07-28 ist
# P10.5-P; Trockenlauf 2026-10-20: Suite 1267/1268 vor Testanpassung. V207: neueste 4.1.x ist
# 4.1.3; Changelog 4.1.1–4.1.3 nennt keine Änderung an http_app, Middleware, get_http_request,
# ToolError oder utilities.types.Image. Der Rückweg ist rollback.sh (eigenes venv je Release).
# (Der Absatz davor — P9-R, 3.4.x, V79/P5-C, V163 — ist damit historisch.)
dependencies = ["storage", "fastmcp==4.1.3", "keyring>=25", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools]
packages = ["mcpserver"]
